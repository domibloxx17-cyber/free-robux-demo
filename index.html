
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE ROBUX GENERATOR - DEMO</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#15171c;
  color:white;
  text-align:center;
}
header {
  background:#252830;
  padding:20px;
  font-size:25px;
  font-weight:bold;
}
h1 {
  color:#00e676;
  font-size:42px;
  margin-top:35px;
}
.container {
  max-width:430px;
  margin:25px auto;
  background:#252830;
  padding:25px;
  border-radius:15px;
}
input, select, button {
  width:100%;
  padding:15px;
  margin:10px 0;
  border:0;
  border-radius:8px;
  font-size:16px;
}
input, select {
  background:#414651;
  color:white;
}
button {
  background:#00b85a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover { background:#009b4b; }
#result {
  margin-top:20px;
  color:#00e676;
  font-weight:bold;
}
.disclaimer {
  color:#aaa;
  font-size:12px;
  margin-top:25px;
}
.coin {
  font-size:75px;
  margin:15px;
}
</style>
</head>
<body>

<header>🎮 ROBUX GENERATOR</header>

<h1>FREE ROBUX!</h1>
<div class="coin">🪙</div>

<div class="container">
  <h2>Get FREE Robux!</h2>
  <p>Enter a username for this demo.</p>

  <input id="username" placeholder="Roblox username">

  <select id="amount">
    <option value="400">400 ROBUX</option>
    <option value="800">800 ROBUX</option>
    <option value="1700">1,700 ROBUX</option>
    <option value="10000">10,000 ROBUX</option>
  </select>

  <button onclick="generate()">GENERATE ROBUX</button>

  <div id="result"></div>
  <div class="disclaimer">
    DEMO ONLY! No real Robux are generated or transferred.
    This is an unofficial fan-made simulation.
  </div>
</div>

<script>
function generate() {
  const username = document.getElementById("username").value.trim();
  const amount = document.getElementById("amount").value;
  const result = document.getElementById("result");

  if (!username) {
    result.textContent = "Please enter a username!";
    return;
  }

  result.textContent = "Starting demo...";
  let progress = 0;

  const timer = setInterval(() => {
    progress += 20;
    result.textContent = "Demo progress: " + progress + "%";

    if (progress >= 100) {
      clearInterval(timer);
      result.innerHTML =
        "😂 JUST A TROLL!<br>" +
        username + ", you selected " + amount +
        " Robux!<br>No real Robux were generated.";
    }
  }, 500);
}
</script>

</body>
</html>
